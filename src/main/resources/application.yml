spring:
  datasource:
    url: jdbc:mysql://localhost:3306/study
    username: root
    password: 0910
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          # create -> JPA가 @Entity가 붙은 대상을 찾아내어 Database에 테이블을 만들게 됩니다.
          # 기존 테이블을 모두 없애버리고 새로 만들게 되니 처음 Database를 만드는 것 아니라면 update로
          auto: update
        default_batch_fetch_size: 1000